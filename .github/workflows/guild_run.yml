name: 포테이토 길드 정기 소집

# Actions가 실행 결과(계좌 상태, 회고 기록)를 저장소에 다시 커밋(push)할 수 있으려면
# 명시적으로 쓰기 권한을 줘야 한다. 이게 없으면 기본 GITHUB_TOKEN이 읽기 전용으로 동작해서
# "Permission to .../....git denied to github-actions[bot]" (403) 오류가 난다.
permissions:
  contents: write

on:
  schedule:
    # UTC 기준 06:30 = 한국시간 15:30 (장 마감 후). 필요하면 자유롭게 수정하세요.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "분석할 종목코드 (공백으로 구분, 예: 005930.KS AAPL)"
        required: true
        default: "005930.KS"

jobs:
  run-guild:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 길드 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py ${{ github.event.inputs.tickers || '005930.KS' }}

      - name: 모의투자 계좌 상태 커밋
        run: |
          git config user.name "potato-guild-bot"
          git config user.email "actions@github.com"
          git add data/portfolio.json data/memory.json
          git diff --cached --quiet || git commit -m "포테이토 계좌 갱신 [skip ci]"
          git push
