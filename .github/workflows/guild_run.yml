name: 포테이토 길드 정기 소집

# Actions가 실행 결과(계좌 상태, 회고 기록)를 저장소에 다시 커밋(push)할 수 있으려면
# 명시적으로 쓰기 권한을 줘야 한다. 이게 없으면 기본 GITHUB_TOKEN이 읽기 전용으로 동작해서
# "Permission to .../....git denied to github-actions[bot]" (403) 오류가 난다.
permissions:
  contents: write

on:
  schedule:
    # UTC 기준 06:30 = 한국시간 15:30 (장 마감 후). 필요하면 자유롭게 수정하세요.
    # 예약 실행은 항상 무료 스크리닝(--screen) 모드로 돈다 - 특정 종목 딥다이브(유료)는
    # 아래 workflow_dispatch로 수동 실행할 때만 tickers를 입력해서 돌린다.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "특정 종목만 딥다이브하려면 종목코드 입력(공백으로 구분, 예: 005930.KS AAPL). 비워두면 무료 스크리닝만 실행"
        required: false
        default: ""

jobs:
  run-guild:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 길드 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python main.py ${{ github.event.inputs.tickers }}
          else
            python main.py --screen
          fi

      - name: 계좌 상태 + 웹 대시보드 데이터 커밋
        run: |
          git config user.name "potato-guild-bot"
          git config user.email "actions@github.com"
          # 스크리닝만 돌린 날은 data/verdicts.json 등 딥다이브 전용 파일이 아직 없을 수 있다.
          # git add는 지정한 경로 중 하나라도 없으면 전체가 실패하므로, 파일마다 따로
          # add하고 없으면 조용히 넘어가게 한다 (|| true).
          for f in data/portfolio.json data/memory.json data/screening_latest.json data/verdicts.json; do
            git add "$f" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "포테이토 계좌/대시보드 데이터 갱신 [skip ci]"
          git push
